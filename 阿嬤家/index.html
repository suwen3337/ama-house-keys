<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>阿嬤家找鑰匙</title>
<style>
  :root {
    --bg: #1d130d; --panel: #2a1c13; --panel2: #3a271a; --ink: #f6e7d2; --muted: #c2a688;
    --red: #c8282d; --red-dark: #9e1b20; --gold: #f2b632; --line: #5a3d27;
    --brush: "DFKai-SB", "標楷體", "BiauKai", "KaiTi", "STKaiti", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #4a2a18, var(--bg) 60%);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 14px 16px 30px; }
  h1 { margin: 0; font-family: var(--brush); color: #ffd98a; letter-spacing: 3px; font-size: 28px;
       text-shadow: 0 2px 10px rgba(255, 140, 40, .4); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .hud { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill, .btn {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; color: var(--ink);
    padding: 7px 14px; font: inherit; font-weight: 700; font-size: 14px;
  }
  .btn { cursor: pointer; }
  .btn:hover { background: var(--panel2); border-color: var(--gold); }
  .hidden { display: none !important; }

  /* ===== 關卡選單 ===== */
  .intro { color: var(--muted); margin: 0 0 16px; line-height: 1.7; }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .lv {
    position: relative; border-radius: 16px; overflow: hidden; cursor: pointer; background: var(--panel);
    border: 2px solid var(--line); transition: transform .15s, border-color .15s;
  }
  .lv:hover { transform: translateY(-3px); border-color: var(--gold); }
  .lv img { width: 100%; aspect-ratio: 1376 / 768; object-fit: cover; display: block; }
  .lv .info { padding: 10px 14px 14px; }
  .lv .name { font-family: var(--brush); font-size: 22px; color: #ffd98a; }
  .lv .prog { height: 8px; background: #120b07; border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .lv .prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ff8a3d); }
  .lv.locked { cursor: not-allowed; }
  .lv.locked img { filter: grayscale(1) brightness(.35); }
  .lv .lock {
    position: absolute; inset: 0 0 auto 0; aspect-ratio: 1376 / 768; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; color: #fff; font-weight: 700; text-align: center; padding: 10px;
  }
  .total { margin-top: 18px; text-align: center; color: var(--muted); }

  /* ===== 場景 ===== */
  #scene {
    position: relative; width: 100%; aspect-ratio: 1376 / 768; overflow: hidden; border-radius: 14px;
    container-type: inline-size; user-select: none; background: #000;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .6), 0 0 0 3px #6b3d20;
  }
  #scene img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hs { position: absolute; cursor: pointer; z-index: 8; border-radius: 6px; }
  .hs:hover { background: rgba(255, 230, 170, .08); box-shadow: inset 0 0 0 2px rgba(255, 220, 140, .35); }
  .hs.target { background: rgba(242, 182, 50, .18); box-shadow: inset 0 0 0 3px var(--gold), 0 0 18px var(--gold); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow: inset 0 0 0 3px var(--gold), 0 0 6px var(--gold); } }
  .ov { position: absolute; z-index: 4; pointer-events: none; }
  .ov.front { z-index: 7; }
  .ov > svg, .spr > svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .spr { position: absolute; cursor: pointer; z-index: 20; }
  .spr.item { animation: bob 2.2s ease-in-out infinite; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .5)); }
  .spr.hkey { z-index: 21; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .6)) saturate(.8) brightness(.92); }
  .spr.pkey { z-index: 22; animation: shine 1.3s ease-in-out infinite; filter: drop-shadow(0 0 6px #ffd84a) drop-shadow(0 0 2px #fff3b0); }
  .spr.flash { animation: flash .5s ease-in-out 6; z-index: 40; }
  @keyframes flash { 50% { transform: scale(2.2); filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px #ffd84a); } }
  @keyframes shine { 50% { transform: scale(1.18) rotate(-12deg); } }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .paper {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #e4403f, #b51d22); color: #1b0d08; white-space: nowrap;
    font-family: var(--brush); font-weight: 700; border-radius: 2px;
    box-shadow: inset 0 0 0 0.2cqw #e8b33a, 0 2px 6px rgba(0, 0, 0, .35);
  }

  /* 打開的門、抽屜、蓋子：把背景圖的那一塊切下來，讓它轉動或滑動 */
  .fx { position: absolute; z-index: 6; pointer-events: none; perspective: 700px; }
  .fx .leaf, .fx .cav, .fx .under { position: absolute; top: 0; height: 100%; }
  .fx .cav, .fx .under { left: 0; width: 100%; }
  .fx .cav { background: radial-gradient(ellipse at 50% 40%, #3a2516, #0e0703 78%); box-shadow: inset 0 0 1.4cqw #000; border-radius: 2px; }
  .fx .under { filter: blur(5px) brightness(.85); }
  /* 打開後裡面的樣子 */
  .fx .cav.wood { background: linear-gradient(#4a2e1a, #6b4527 60%, #553620); box-shadow: inset 0 0.5cqw 0.9cqw rgba(0, 0, 0, .75), inset 0 -0.2cqw 0.3cqw rgba(0, 0, 0, .4); }
  .fx .cav.paper { background: linear-gradient(#4a2c14, #8a6234 45%, #e2c895); box-shadow: inset 0.3cqw 0 0.4cqw rgba(0, 0, 0, .4), inset -0.3cqw 0 0.4cqw rgba(0, 0, 0, .4); }
  .fx .cav.fridge {
    background:
      radial-gradient(ellipse at 22% 22%, #d9732a 0 9%, transparent 10%),
      radial-gradient(ellipse at 45% 20%, #c8282d 0 8%, transparent 9%),
      radial-gradient(ellipse at 72% 55%, #f2e6c8 0 12%, transparent 13%),
      radial-gradient(ellipse at 30% 86%, #3f8a4a 0 10%, transparent 11%),
      radial-gradient(ellipse at 70% 88%, #e8b84a 0 8%, transparent 9%),
      repeating-linear-gradient(transparent 0 31%, rgba(90, 105, 110, .7) 31% 34%),
      linear-gradient(#e4e6dc, #9aa6a4);
    box-shadow: inset 0 0 1.2cqw rgba(255, 245, 210, .6), inset 0 0.5cqw 0.8cqw rgba(0, 0, 0, .45);
  }
  .fx .cav.fire {
    background: radial-gradient(ellipse at 50% 92%, #ffd36b 0, #ff7a1a 14%, #b8320c 32%, #3a1206 58%, #140703 80%);
    animation: embers 1.4s ease-in-out infinite alternate;
  }
  @keyframes embers { to { filter: brightness(1.25) saturate(1.2); } }
  .fx .cav.closet {
    background:
      linear-gradient(transparent 7%, #b08a4a 7% 8.2%, transparent 8.2%),
      radial-gradient(ellipse at 50% 35%, transparent 30%, rgba(0, 0, 0, .7) 90%),
      linear-gradient(rgba(0, 0, 0, .35), transparent 25%, transparent 60%, rgba(0, 0, 0, .75) 72%, #1a0f08 73%),
      repeating-linear-gradient(90deg, #4a1418 0 9%, #140b06 9% 10.5%, #6e5c3c 10.5% 17%, #140b06 17% 18.5%, #23303c 18.5% 27%, #140b06 27% 28.5%, #5a2a3a 28.5% 34%, #140b06 34% 35.5%),
      #1a0f08;
    box-shadow: inset 0 0.8cqw 1.4cqw rgba(0, 0, 0, .85);
  }
  .fx .cav.shed { background: linear-gradient(#4a423a, #2a241f); box-shadow: inset 0 0.8cqw 1.2cqw rgba(0, 0, 0, .8); }
  /* 水柱 */
  .pour {
    position: absolute; z-index: 9; pointer-events: none; transform-origin: top; border-radius: 0.3cqw;
    background: repeating-linear-gradient(180deg, rgba(210, 240, 255, .95) 0 0.6cqw, rgba(120, 190, 230, .7) 0.6cqw 1.2cqw);
    animation: flow .25s linear infinite;
  }
  @keyframes flow { to { background-position: 0 1.2cqw; } }
  .scissor { position: absolute; z-index: 30; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .5)); }
  .scissor svg { width: 100%; height: 100%; overflow: visible; }
  /* 音樂盒 */
  .crank { transform-box: view-box; transform-origin: 64px 36px; }
  .mbLid { transform-box: view-box; transform-origin: 35px 25px; }
  .note { animation: noteUp 2.6s linear infinite; fill: #ffe39a; font: 700 10px Georgia, serif; }
  .note:nth-of-type(2) { animation-delay: .9s; }
  .note:nth-of-type(3) { animation-delay: 1.7s; }
  @keyframes noteUp { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(8px, -26px); } }
  .fx .leaf { background-repeat: no-repeat; box-shadow: 0 0 0.5cqw rgba(0, 0, 0, .45); }
  .fx.open .leaf { filter: brightness(.82); }

  /* 動物 */
  .actor .wing { transform-origin: 56px 40px; transform-box: view-box; }
  .actor.flying .wing { animation: flap .12s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: rotate(-35deg) scaleY(1.2); } to { transform: rotate(20deg) scaleY(.6); } }
  .actor.walking { animation: walk .25s ease-in-out infinite alternate; }
  @keyframes walk { to { translate: 0 -3px; } }
  .flame { animation: flicker .18s ease-in-out infinite alternate; transform-origin: 50% 90%; }
  @keyframes flicker { to { transform: scale(.88, 1.08); opacity: .85; } }

  /* 出口路標 */
  .sign {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    background: rgba(25, 12, 4, .78); border: 0.2cqw solid #8a6a40; border-radius: 1cqw; color: #c9b08a;
    font-size: 1.5cqw; font-weight: 800; padding: 0.3cqw; white-space: nowrap;
  }
  .sign.open { color: #ffe39a; border-color: var(--gold); animation: beckon 1.2s ease-in-out infinite; }
  @keyframes beckon { 50% { box-shadow: 0 0 1.6cqw var(--gold); } }
  .hs.exitOpen { box-shadow: inset 0 0 0 0.25cqw rgba(242, 182, 50, .55); animation: beckonHs 1.6s ease-in-out infinite; }
  @keyframes beckonHs { 50% { box-shadow: inset 0 0 0 0.25cqw rgba(242, 182, 50, .9), 0 0 1.4cqw rgba(242, 182, 50, .6); } }

  #dark {
    position: absolute; inset: 0; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .5s;
    background: radial-gradient(circle at 50% 30%, rgba(10, 10, 40, .84), rgba(2, 2, 12, .95));
  }
  #scene.dark #dark { opacity: 1; }
  #scene.dark .hs:not(.switch), #scene.dark .spr { pointer-events: none; }
  .glow {
    position: absolute; z-index: 60; transform: translate(-50%, -50%); display: none; pointer-events: none;
    color: #fff2a8; font: 900 3.4cqw Georgia, serif; text-shadow: 0 0 0.8cqw #ffd000, 0 0 2cqw #ff9000, 0 0 3cqw #ff6a00;
  }
  #scene.dark .glow { display: block; }
  .hs.switch { z-index: 60; }
  .toast {
    position: absolute; left: 50%; top: 8%; transform: translateX(-50%); z-index: 70; pointer-events: none;
    background: rgba(20, 10, 4, .85); color: #ffe7a8; padding: 0.6cqw 1.6cqw; border-radius: 99px;
    font-size: 1.6cqw; font-weight: 700; animation: toast 1.6s forwards;
  }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 15%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  .fly { position: fixed; z-index: 300; width: 46px; height: 46px; pointer-events: none; filter: drop-shadow(0 0 6px #ffd84a); }
  .fly svg { width: 100%; height: 100%; overflow: visible; }
  #fade { position: fixed; inset: 0; background: #000; z-index: 250; pointer-events: none; opacity: 0; }

  /* 牆上的照片 */
  .photoFrame { width: 100%; height: 100%; padding: 0.35cqw; background: linear-gradient(135deg, #6b4423, #3d2512);
    box-shadow: 0 0.3cqw 0.6cqw rgba(0, 0, 0, .45); }
  .photoFrame img, .photoFrame .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photoFrame .ph { background: #efe3cf; color: #8b6a55; font-size: 1cqw; display: flex; align-items: center; justify-content: center; }

  /* 標記模式 */
  #scene.edit .hs { outline: 2px solid rgba(0, 255, 200, .8); background: rgba(0, 255, 200, .08); }
  #scene.edit .hs::after { content: attr(data-id); position: absolute; left: 2px; top: 1px; font-size: 11px; color: #0fc; text-shadow: 0 0 3px #000; }
  #scene.edit .spr { outline: 2px solid #f0f; }
  #editBox { position: absolute; z-index: 80; border: 2px dashed #0fc; pointer-events: none; }
  #editOut { font: 13px Consolas, monospace; color: #0fc; background: #0b0b0b; padding: 8px 10px; border-radius: 8px; margin-top: 8px; white-space: pre-wrap; }

  .bar { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-top: 12px; }
  #msg { min-height: 26px; line-height: 1.6; }
  #msg b { color: #ffd98a; }
  #inv { display: flex; gap: 8px; flex-wrap: wrap; min-height: 62px; align-items: center; }
  #inv .empty { color: var(--muted); font-size: 14px; }
  .item {
    width: 64px; height: 64px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel2);
    cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform .1s;
  }
  .item:hover { transform: translateY(-2px); }
  .item svg { width: 38px; height: 38px; overflow: visible; }
  .item small { font-size: 11px; color: var(--muted); }
  .item.sel { border-color: var(--gold); background: #5a3a14; box-shadow: 0 0 0 3px rgba(242, 182, 50, .35); }

  .modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .65); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff8ee; color: #3a2010; border-radius: 18px; padding: 24px; max-width: 440px; width: 100%;
    text-align: center; border: 3px solid var(--red); box-shadow: 0 0 0 6px #f6d38a; max-height: 92vh; overflow: auto;
  }
  .modal.wide { max-width: 780px; }
  .modal h2 { margin: 0 0 10px; color: var(--red-dark); font-family: var(--brush); font-size: 30px; }
  .modal button { font: inherit; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; background: var(--red); color: #fff; padding: 10px 20px; margin: 4px; }
  .modal button:hover { background: var(--red-dark); }
  .modal button.ghost { background: #ecdcca; color: #3a2010; }
  .modal .pic { width: 100%; border-radius: 10px; display: block; box-shadow: 0 4px 14px rgba(0, 0, 0, .3); }
  /* 老照片：轉成黑白，對比調高一點，像老相片 */
  .modal .pic.old { filter: grayscale(1) contrast(1.12); border: 10px solid #f4f0e6; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); }
  .modal .ph { padding: 40px 16px; background: #f3e4d0; border-radius: 10px; color: #8b6a55; }
  .modal .speech { font-family: var(--brush); font-size: 26px; color: var(--red-dark); margin: 14px 0 6px; }
  .dials { display: flex; justify-content: center; gap: 10px; margin: 16px 0; }
  .dial { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .dial span { width: 56px; height: 66px; border-radius: 10px; color: #ffe27a; background: linear-gradient(#4a2c1c, #2b170c);
    box-shadow: inset 0 3px 8px #000; font: 800 36px Georgia, serif; display: flex; align-items: center; justify-content: center; }
  .dial button { padding: 2px 16px; margin: 0; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 12px 0; font-weight: 700; }
  .cal div { padding: 6px 0; border-radius: 6px; background: #f3e4d0; position: relative; }
  .cal .c { box-shadow: inset 0 0 0 3px var(--red); }
  .cal .c sup { position: absolute; right: 2px; top: -6px; color: var(--red); font-size: 12px; }
  .note { font-family: var(--brush); font-size: 28px; background: #fffbe6; border: 1px solid #e6d7a8; padding: 18px; margin: 12px 0;
    transform: rotate(-2deg); box-shadow: 0 4px 10px rgba(0, 0, 0, .15); }
  .confetti { position: fixed; top: -50px; width: 30px; z-index: 200; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }

  /* ===== 放大縮小用的舞台 ===== */
  #scene { touch-action: none; }
  #stage { position: absolute; inset: 0; transform-origin: 0 0; }
  #stage.smooth { transition: transform .3s ease-out; }
  .invTitle { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .fsBtn { display: none; }
  #rotateHint {
    display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); color: var(--ink);
    flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
  }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  body.portraitPhone.ingame #rotateHint { display: flex; }

  /* ===== 手機橫放（畫面高度很矮的時候） =====
     左邊一排按鈕、中間場景盡量放大、右邊一排物品欄 */
  body.mobile.ingame { overflow: hidden; }
  body.mobile.ingame .wrap { padding: 0; max-width: none; }
  body.mobile.ingame .top {
    position: fixed; left: 0; top: 0; bottom: 0; width: calc(66px + env(safe-area-inset-left)); margin: 0; z-index: 90;
    padding: 6px 4px 6px calc(4px + env(safe-area-inset-left)); background: rgba(20, 12, 7, .92);
    flex-direction: column; justify-content: flex-start; align-items: stretch; flex-wrap: nowrap; overflow-y: auto;
  }
  body.mobile.ingame h1 { display: none; }
  body.mobile.ingame #hudLevel { flex-direction: column; flex-wrap: nowrap; gap: 4px; }
  body.mobile.ingame #hudLevel .pill, body.mobile.ingame #hudLevel .btn {
    padding: 4px 2px; font-size: 11px; border-radius: 10px; text-align: center; line-height: 1.25; white-space: normal;
  }
  body.mobile.ingame #lvName { display: none; }
  body.mobile.ingame .fsBtn { display: block; }
  body.mobile.ingame #game {
    position: fixed; top: 0; bottom: 0; left: calc(66px + env(safe-area-inset-left)); right: calc(78px + env(safe-area-inset-right));
    display: flex; align-items: center; justify-content: center; background: #000;
  }
  body.mobile.ingame #scene { width: min(100%, calc(100dvh * 1376 / 768)); border-radius: 0; box-shadow: none; }
  /* 提示文字浮在畫面下方，幾秒後淡出 */
  body.mobile.ingame #msgBar {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); margin: 0; z-index: 80;
    width: max-content; max-width: calc(100% - 16px); padding: 6px 12px; font-size: 13px; line-height: 1.45;
    background: rgba(20, 10, 4, .85); pointer-events: none; opacity: 0;
  }
  body.mobile.ingame #msgBar.fresh { animation: msgShow 6s forwards; }
  @keyframes msgShow { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
  body.mobile.ingame #msg { min-height: 0; }
  /* 物品欄在右邊直直一排 */
  body.mobile.ingame #invBar {
    position: fixed; top: 0; bottom: 0; right: 0; width: calc(78px + env(safe-area-inset-right)); margin: 0; border-radius: 0; z-index: 90;
    padding: 6px calc(5px + env(safe-area-inset-right)) 6px 5px; overflow-y: auto; background: rgba(20, 12, 7, .92); border: none;
  }
  body.mobile.ingame .invTitle { font-size: 11px; text-align: center; margin-bottom: 4px; }
  body.mobile.ingame .invTitle::after { content: '🎒'; font-size: 18px; display: block; }
  body.mobile.ingame .invTitle { font-size: 0; }
  body.mobile.ingame #inv { flex-direction: column; flex-wrap: nowrap; gap: 6px; min-height: 0; }
  body.mobile.ingame #inv .empty { font-size: 11px; text-align: center; }
  body.mobile.ingame .item { width: 62px; height: 58px; }
  body.mobile.ingame .item svg { width: 32px; height: 32px; }
  /* 手指比較粗：鑰匙和撿得起來的東西，可以點的範圍放大成三倍 */
  body.mobile .spr::before { content: ''; position: absolute; inset: -100%; }
  /* 彈出視窗在矮螢幕上縮小一點 */
  body.mobile .modal { padding: 14px 18px; }
  body.mobile .modal h2 { font-size: 22px; margin-bottom: 4px; }
  body.mobile .modal .pic { max-height: 52vh; width: auto; max-width: 100%; margin: 0 auto; }
  body.mobile .dials { margin: 8px 0; }
  body.mobile .dial span { width: 46px; height: 50px; font-size: 28px; }
  body.mobile .cal { margin: 6px 0; font-size: 12px; }
  body.mobile .cal div { padding: 2px 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

// 月曆的一頁（跟圖上的月曆一樣：紅色上半部、金色圓圈裡的大數字、下面是日期）
function calendarPage(m) {
  const first = new Date(2026, m - 1, 1).getDay(), days = new Date(2026, m, 0).getDate();
  let cells = '';
  ['日', '一', '二', '三', '四', '五', '六'].forEach((d, i) => { cells += `<text x="${11 + i * 14.5}" y="122" font-size="7" fill="${i ? '#555' : '#c8282d'}" text-anchor="middle">${d}</text>`; });
  for (let d = 1; d <= days; d++) {
    const idx = first + d - 1, col = idx % 7, row = Math.floor(idx / 7);
    cells += `<text x="${11 + col * 14.5}" y="${136 + row * 11}" font-size="8.5" font-weight="700" fill="${col ? '#333' : '#c8282d'}" text-anchor="middle">${d}</text>`;
  }
  return `<svg viewBox="0 0 110 192" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">
    <rect x="2" y="5" width="106" height="185" rx="2" fill="#f3ebde"/>
    <rect x="2" y="5" width="106" height="82" fill="#c8282d"/>
    <circle cx="55" cy="45" r="33" fill="#f2c14e"/><circle cx="55" cy="45" r="29" fill="none" stroke="#e09a2a" stroke-width="1.5"/>
    <text x="55" y="63" text-anchor="middle" font-size="52" font-weight="900" fill="#c8282d" font-family="Georgia, serif">${m}</text>
    <text x="55" y="104" text-anchor="middle" font-size="15" font-weight="900" fill="#c8282d" font-family="Georgia, serif">${m}</text>
    <line x1="8" y1="110" x2="102" y2="110" stroke="#d9c8b0"/>
    ${cells}
    <rect x="2" y="5" width="106" height="185" rx="2" fill="none" stroke="#d9c8b0"/>
  </svg>`;
}

    bass: '1 5, 6, 5, 4, 5, 6, 1', perc: 'DC.CDCbCD.CbDCDC' },

const DEG = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11 };
function parseNotes(str, base) {
  const toks = str.trim().split(/\s+/);
  return toks.map((t, i) => {
    if (t === '-' || t === '0') return null;
    let semi = DEG[t[0]];
    for (const c of t.slice(1)) semi += c === "'" ? 12 : -12;
    let len = 1;
    while (toks[i + len] === '-') len++;
    return { f: base * Math.pow(2, semi / 12), len };
  });
}

const Music = {
  ctx: null, on: true, want: 'home', playing: null, step: 0, next: 0, timer: null, noise: null,
  init() {
    try { this.on = localStorage.getItem('ama-music') !== 'off'; } catch (e) { /* 預設開 */ }
    this.updateBtn();
  },
  // 瀏覽器規定要使用者點過畫面才能出聲，所以第一次點擊時才建立
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.on ? 0.55 : 0; this.master.connect(this.ctx.destination);
      this.bus = this.ctx.createGain(); this.bus.gain.value = 0.55; this.bus.connect(this.master);
      this.fxBus = this.ctx.createGain(); this.fxBus.gain.value = 0.9; this.fxBus.connect(this.master);
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (this.playing !== this.want) this.play(this.want);
  },
  scene(name) { this.want = name; if (this.ctx) this.play(name); },
  play(name) {
    const t = TRACKS[name];
    this.playing = name;
    this.track = { ...t, notes: parseNotes(t.mel, t.base), bassNotes: parseNotes(t.bass, t.base / 2) };
    this.step = 0;
    this.next = this.ctx.currentTime + 0.15;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 60);
  },
  tick() {
    if (!this.track || !this.ctx) return;
    const spb = 60 / this.track.bpm / 2;
    while (this.next < this.ctx.currentTime + 0.25) {
      this.schedule(this.step, this.next, spb);
      this.next += spb;
      this.step = (this.step + 1) % this.track.notes.length;
    }
  },
  schedule(i, t, spb) {
    const tr = this.track, n = tr.notes[i];
    if (n && tr.lead === 'suona') {
      this.suona(n.f, t, n.len * spb);
      this.pluck(n.f / 2, t, n.len * spb, 0.1, this.bus);   // 低八度的撥弦襯底
    } else if (n) this.pluck(n.f, t, n.len * spb, 0.2, this.bus);
    if (i % 8 === 0) {
      const b = tr.bassNotes[(i / 8) % tr.bassNotes.length];
      if (b) this.bass(b.f, t, spb * 7);
    }
    if (tr.gong && i % tr.gong === 0) this.gong(t);
    // 打擊樂：d 鼓、D 大鼓、b 木魚、c 小鈸、C 鈸、x 鼓加小鈸
    const p = tr.perc[i % tr.perc.length];
    if (p === 'd' || p === 'x') this.drum(t);
    if (p === 'D') this.bigDrum(t);
    if (p === 'b') this.block(t, 0.12);
    if (p === 'c' || p === 'x') this.cymbal(t);
    if (p === 'C') this.cha(t);
  },
  // 嗩吶：尖亮的鼻音，起音從下面滑上來，帶一點顫音
  suona(f, t, dur) {
    const c = this.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g2 = c.createGain();
    const lfo = c.createOscillator(), lfoG = c.createGain(), bp = c.createBiquadFilter(), lp = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; g2.gain.value = 0.45;
    o.frequency.setValueAtTime(f * 0.93, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.05);
    o2.frequency.setValueAtTime(f * 0.932, t); o2.frequency.exponentialRampToValueAtTime(f * 1.002, t + 0.05);
    lfo.frequency.value = 6.5; lfoG.gain.value = f * 0.014;
    lfo.connect(lfoG); lfoG.connect(o.frequency); lfoG.connect(o2.frequency);
    bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 1.1;
    lp.type = 'lowpass'; lp.frequency.value = 5000;
    const len = Math.max(0.12, dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.08, t + 0.03);
    g.gain.setValueAtTime(0.065, t + len * 0.75);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.06);
    o.connect(bp); o2.connect(g2).connect(bp); bp.connect(lp).connect(g).connect(this.bus);
    [o, o2, lfo].forEach((x) => { x.start(t); x.stop(t + len + 0.1); });
  },
  // 大鑼：幾個不和諧的低音疊在一起，慢慢消失
  gong(t) {
    [[82, 1], [131, 0.6], [197, 0.45], [263, 0.3], [347, 0.2]].forEach(([f, a]) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.frequency.setValueAtTime(f * 1.04, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.5);
      this.env(g, t, 0.16 * a, 3);
      o.connect(g).connect(this.bus); o.start(t); o.stop(t + 3.1);
    });
    this.noiseHit(t, 0.07, 2500, 1.4, 'bandpass');
  },
  bigDrum(t) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.3);
    this.env(g, t, 0.7, 0.45);
    o.connect(g).connect(this.bus); o.start(t); o.stop(t + 0.5);
    this.noiseHit(t, 0.05, 900, 0.06, 'lowpass');
  },
  // 鈸：「鏘」
  cha(t) {
    this.noiseHit(t, 0.13, 4200, 0.3, 'bandpass');
    this.noiseHit(t, 0.05, 9000, 0.55, 'highpass');
  },
  env(g, t, peak, decay) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  },
  // 撥弦聲（有點像古箏）
  pluck(f, t, dur, vol, out) {
    const c = this.ctx, o1 = c.createOscillator(), o2 = c.createOscillator(), g2 = c.createGain(), lp = c.createBiquadFilter(), g = c.createGain();
    o1.type = 'triangle'; o1.frequency.value = f;
    o2.type = 'sawtooth'; o2.frequency.value = f * 2.003; g2.gain.value = 0.1;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(3400, t); lp.frequency.exponentialRampToValueAtTime(700, t + 0.45);
    const decay = Math.max(0.6, dur * 1.7);
    this.env(g, t, vol, decay);
    o1.connect(lp); o2.connect(g2).connect(lp); lp.connect(g).connect(out);
    o1.start(t); o2.start(t); o1.stop(t + decay + 0.05); o2.stop(t + decay + 0.05);
  },
  bass(f, t, dur) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f;
    this.env(g, t, 0.16, dur);
    o.connect(g).connect(this.bus); o.start(t); o.stop(t + dur + 0.05);
  },
  drum(t) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.25);
    this.env(g, t, 0.45, 0.35);
    o.connect(g).connect(this.bus); o.start(t); o.stop(t + 0.4);
  },
  block(t, vol, out = this.bus) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 1150;
    this.env(g, t, vol, 0.07);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.1);
  },
  noiseHit(t, vol, freq, decay, type = 'highpass', out = this.bus) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = type; f.frequency.value = freq;
    this.env(g, t, vol, decay);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + decay + 0.05);
  },
  cymbal(t) { this.noiseHit(t, 0.06, 7000, 0.45); },
  // 音效
  sfx(name) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + 0.01, out = this.fxBus;
    const notes = (fs, gap, vol) => fs.forEach((f, i) => this.pluck(f, t + i * gap, 0.2, vol, out));
    if (name === 'tap') this.block(t, 0.3, out);
    if (name === 'pick') notes([1046.5, 1568], 0.08, 0.28);
    if (name === 'key') notes([1046.5, 1318.5, 1568, 2093], 0.07, 0.25);
    if (name === 'reveal') notes([784, 1046.5, 1318.5], 0.09, 0.25);
    if (name === 'wrong') { const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.frequency.value = 160; this.env(g, t, 0.25, 0.18); o.connect(g).connect(out); o.start(t); o.stop(t + 0.2); }
    if (name === 'open') { this.noiseHit(t, 0.18, 600, 0.45, 'lowpass', out); this.block(t + 0.05, 0.15, out); }
    if (name === 'whoosh') this.noiseHit(t, 0.15, 1500, 0.6, 'bandpass', out);
    if (name === 'flap') for (let i = 0; i < 6; i++) this.noiseHit(t + i * 0.11, 0.08, 900, 0.07, 'bandpass', out);
    if (name === 'water') for (let i = 0; i < 12; i++) this.noiseHit(t + i * 0.1, 0.06, 1800 + Math.random() * 1500, 0.12, 'bandpass', out);
    if (name === 'snip') for (let i = 0; i < 3; i++) { this.noiseHit(t + i * 0.2, 0.25, 5000, 0.04, 'highpass', out); this.block(t + i * 0.2, 0.08, out); }
    if (name === 'ding') this.pluck(2093, t, 0.3, 0.2, out);
    if (name === 'rip') this.noiseHit(t, 0.2, 2500, 0.35, 'bandpass', out);
    // 音樂盒：清脆的高音，一段短短的旋律
    if (name === 'musicbox') {
      [1568, 1318.5, 1174.7, 1046.5, 1174.7, 1318.5, 1568, 2093, 1760, 1568].forEach((f, i) => this.pluck(f, t + 0.6 + i * 0.22, 0.5, 0.16, out));
    }
    // 鞭炮：一連串隨機的劈啪聲，中間夾幾聲比較大的
    if (name === 'firecracker') {
      for (let i = 0; i < 70; i++) {
        const at = t + Math.random() * 2.2;
        this.noiseHit(at, 0.12 + Math.random() * 0.25, 1500 + Math.random() * 4000, 0.03 + Math.random() * 0.03, 'bandpass', out);
      }
      for (let i = 0; i < 5; i++) this.noiseHit(t + Math.random() * 2, 0.4, 400, 0.15, 'lowpass', out);
    }
  },
  toggle() {
    this.on = !this.on;
    try { localStorage.setItem('ama-music', this.on ? 'on' : 'off'); } catch (e) { /* 沒關係 */ }
    if (this.master) this.master.gain.value = this.on ? 0.55 : 0;
    this.unlock();
    this.updateBtn();
  },
  updateBtn() { document.querySelectorAll('.muteBtn').forEach((b) => { b.textContent = this.on ? '🔊 音樂' : '🔇 靜音'; }); },
};
document.addEventListener('pointerdown', () => Music.unlock());

// 頁面被關掉、切到別的 App、或藏到背景時，暫停所有聲音；回來時再繼續
// （手機瀏覽器和 LINE 內建瀏覽器關掉頁面時，常常只是藏到背景，不暫停的話音樂會一直播）
function pauseAudio() { if (Music.ctx && Music.ctx.state === 'running') Music.ctx.suspend(); }
function resumeAudio() {
  if (Music.ctx && Music.ctx.state === 'suspended' && document.visibilityState === 'visible') Music.ctx.resume();
}
document.addEventListener('visibilitychange', () => (document.hidden ? pauseAudio() : resumeAudio()));
addEventListener('pagehide', pauseAudio);
addEventListener('freeze', pauseAudio);
addEventListener('pageshow', resumeAudio);
// 手機上切換到別的 App 時，有些瀏覽器只會觸發 blur，所以觸控裝置也聽 blur／focus
if (matchMedia('(pointer: coarse)').matches) {
  addEventListener('blur', pauseAudio);
  addEventListener('focus', resumeAudio);
}

// ============================================================
//  存檔
// ============================================================
const SAVE_KEY = 'ama-keys-v1';
let SAVE;
function loadSave() {
  try { SAVE = JSON.parse(localStorage.getItem(SAVE_KEY)) || null; } catch (e) { SAVE = null; }
  if (!SAVE) SAVE = { levels: {}, hints: 0, lens: 0, start: Date.now() };
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* 存不了就算了 */ } }
function LS(id) {
  return SAVE.levels[id] || (SAVE.levels[id] = { keys: {}, revealed: {}, done: {}, inv: [], picked: {}, taps: {}, counts: {}, lensIdx: 0 });
}
const keyCount = (id) => Object.keys(LS(id).keys).length;
const grandTotal = () => LEVELS.reduce((s, l) => s + keyCount(l.id), 0);
const isUnlocked = (i) => i === 0 || keyCount(LEVELS[i - 1].id) >= UNLOCK_AT;

// ============================================================
//  小工具
// ============================================================
const $ = (s) => document.querySelector(s);
const W = 1376, H = 768;
const box = (x, y, w, h) => `left:${x / W * 100}%;top:${y / H * 100}%;width:${w / W * 100}%;height:${h / H * 100}%`;
const boxAt = ([x, y], s) => box(x - s / 2, y - s / 2, s, s);
// 從背景圖切出 r 這一塊（用來做門、抽屜的動畫）；src 可以指定別張圖，例如擦掉東西後的圖
const crop = (r, src = L.image) => `background-image:url('${src}');background-size:${W / r[2] * 100}% ${H / r[3] * 100}%;` +
  `background-position:${r[0] / (W - r[2]) * 100}% ${r[1] / (H - r[3]) * 100}%`;
// 東西被拿走後，用「擦掉這個東西的圖」的同一塊蓋在原位
const patch = (src, r) => `<div style="width:100%;height:100%;${crop(r, src)};background-repeat:no-repeat"></div>`;
// 舞台：場景裡真正放圖和所有東西的那一層，放大縮小時整層一起動
const stage = () => $('#stage') || $('#scene');
// 舞台在螢幕上的位置和大小：用縮放倍率直接算（不去量畫面，縮放動畫進行中也準確）
function stageRect() {
  const r = $('#scene').getBoundingClientRect();
  return { left: r.left + Z.x, top: r.top + Z.y, width: r.width * Z.s, height: r.height * Z.s };
}
function say(t) {
  $('#msg').innerHTML = t;
  // 手機版的文字浮在畫面上，幾秒後淡出；每次有新文字就重新顯示
  const bar = $('#msgBar');
  bar.classList.remove('fresh'); void bar.offsetWidth; bar.classList.add('fresh');
}
function toast(t) {
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = t;
  $('#scene').appendChild(el);
  setTimeout(() => el.remove(), 1700);
}
// 原圖座標 → 螢幕座標
function toScreen([x, y]) {
  const r = stageRect();
  return [r.left + x / W * r.width, r.top + y / H * r.height];
}
const centerOf = (r) => [r[0] + r[2] / 2, r[1] + r[3] / 2];
const rectCenter = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
// 東西飛到物品欄、鑰匙飛到計數器的動畫
function fly(svg, from, to, size = 46) {
  const d = document.createElement('div');
  d.className = 'fly'; d.innerHTML = svg;
  d.style.left = from[0] - size / 2 + 'px'; d.style.top = from[1] - size / 2 + 'px';
  d.style.width = d.style.height = size + 'px';
  document.body.appendChild(d);
  const dx = to[0] - from[0], dy = to[1] - from[1];
  // fill: 'forwards' 讓它播完停在終點（而且已經透明），不會跳回起點變成殘影
  const a = d.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 80}px) scale(1.3)`, opacity: 1, offset: 0.45 },
    { transform: `translate(${dx}px, ${dy}px) scale(.5)`, opacity: 0 },
  ], { duration: 750, easing: 'ease-in-out', fill: 'forwards' });
  a.onfinish = () => d.remove();
  setTimeout(() => d.remove(), 1500);   // 保險：萬一動畫被瀏覽器暫停，也會清掉
}

let L = null;        // 目前的關卡
let sel = null;      // 選取中的道具
let dark = false;
let lastPt = null;   // 最後一次點擊的螢幕位置
let acted = null;    // 這次點擊有反應的地方（用來播動畫）
let opened = null;   // 這次點擊剛打開的門／抽屜
let closing = null;  // 這次點擊要關上的門／抽屜
let reopened = false; // 是不是重新打開（重新打開不用等剪刀）
let freshKeys = [];  // 這次剛出現的鑰匙
let post = [];       // 畫面更新後要執行的動畫
const EDIT = new URLSearchParams(location.search).has('edit');

// 目前關卡的完成狀態，給 when / show / hints 用
function flags() {
  const st = LS(L.id);
  return { ...st.done, plateCount: st.counts.plate || 0, taps: st.taps };
}

// ============================================================
//  關卡選單
// ============================================================
function goHome() {
  L = null; sel = null; dark = false;
  document.body.classList.remove('ingame');
  Music.scene('home');
  $('#home').classList.remove('hidden'); $('#game').classList.add('hidden');
  $('#hudHome').classList.remove('hidden'); $('#hudLevel').classList.add('hidden');
  $('#levels').innerHTML = LEVELS.map((lv, i) => {
    const n = keyCount(lv.id), open = isUnlocked(i);
    return `<div class="lv ${open ? '' : 'locked'}" onclick="${open ? `enter(${i})` : ''}">
      <img src="${lv.image}" alt="${lv.name}">
      ${open ? '' : `<div class="lock"><span style="font-size:32px">🔒</span>在「${LEVELS[i - 1].name}」找到 ${UNLOCK_AT} 把鑰匙解鎖</div>`}
      <div class="info"><div class="name">第 ${lv.id} 關　${lv.name}</div>
        <div style="color:var(--muted);font-size:14px;margin-top:2px">🔑 ${n} / ${KEYS_PER_LEVEL}${n === KEYS_PER_LEVEL ? '　✨ 全部找到！' : ''}</div>
        <div class="prog"><i style="width:${n / KEYS_PER_LEVEL * 100}%"></i></div></div>
    </div>`;
  }).join('');
  const t = grandTotal();
  $('#grandTotal').textContent = `🔑 ${t} / 100`;
  $('#totalNote').innerHTML = t === 100
    ? '🧧 100 把鑰匙全部找齊了！<button class="btn" onclick="showEnding()" style="margin-left:8px">🍲 再看一次年夜飯</button>'
    : `還差 ${100 - t} 把鑰匙` +
      // 網址後面加 ?ending 可以直接試聽結局（測試用）
      (new URLSearchParams(location.search).has('ending') ? '<button class="btn" onclick="showEnding()" style="margin-left:8px">🍲 試看結局</button>' : '');
}

function enter(i) {
  L = LEVELS[i]; sel = null; dark = false;
  Z.s = 1; Z.x = 0; Z.y = 0;   // 換關時縮放歸零
  document.body.classList.add('ingame');
  Music.scene(L.music);
  $('#home').classList.add('hidden'); $('#game').classList.remove('hidden');
  $('#hudHome').classList.add('hidden'); $('#hudLevel').classList.remove('hidden');
  $('#lvName').textContent = `第 ${L.id} 關　${L.name}`;
  $('#editOut').classList.toggle('hidden', !EDIT);
  say(L.intro);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 黑幕轉場
function transition(fn) {
  Music.sfx('whoosh');
  const f = $('#fade');
  f.getAnimations().forEach((a) => a.cancel());
  f.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450, fill: 'forwards' });
  // 用計時器換關，就算動畫被瀏覽器暫停也不會卡住
  setTimeout(() => {
    fn();
    f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: 'forwards' });
  }, 450);
}

// ============================================================
//  畫面繪製
// ============================================================
function fxHtml(h, closedNow) {
  const r = h.fx.r || h.r, t = h.fx.t;
  let leaves;
  if (t === 'door') {
    const left = h.fx.hinge !== 'right';
    leaves = [{ r, css: 'left:0;width:100%', origin: left ? 'left center' : 'right center', open: `rotateY(${left ? -72 : 72}deg)` }];
  } else if (t === 'doors') {
    const half = r[2] / 2;
    leaves = [
      { r: [r[0], r[1], half, r[3]], css: 'left:0;width:50%', origin: 'left center', open: 'rotateY(-72deg)' },
      { r: [r[0] + half, r[1], half, r[3]], css: 'left:50%;width:50%', origin: 'right center', open: 'rotateY(72deg)' },
    ];
  } else if (t === 'drawer') {
    leaves = [{ r, css: 'left:0;width:100%', origin: 'center top', open: 'translateY(26%) scale(1.07)' }];
  } else {
    // 蓋子：往上掀起後拿開（淡出），留下打開的盒子
    leaves = [{ r, css: 'left:0;width:100%', origin: 'center bottom', open: 'translateY(-140%) rotate(-8deg)', fade: true }];
  }
  // front: 圖上擋在這扇門前面的東西（例如禮盒），從背景圖切出來重新蓋在最上面；第 5 個值是外形（clip-path）
  const front = (h.fx.front || []).map((fr) =>
    `<div class="ov" style="${box(...fr)};z-index:7;${crop(fr)};${fr[4] ? `clip-path:${fr[4]}` : ''}"></div>`).join('') +
    // frontImg：已經去背好的前景圖（例如倉庫前的蕨類）
    (h.fx.frontImg || []).map((fi) => `<img class="ov" src="${fi.src}" alt="" style="${box(...fi.r)};z-index:7">`).join('');
  // inside: 打開後裡面長什麼樣子
  //   wood 木頭櫃子（預設）、fridge 冰箱、fire 灶裡的炭火、closet 掛著衣服的衣櫃、shed 倉庫、paper 禮盒
  //   same 玻璃門：打開後裡面還是原本看得到的東西，只是暗一點
  const inside = h.fx.inside || 'wood';
  // cavClip：裡面只顯示在這個形狀內（例如只顯示禮盒的盒口）
  const cavClip = h.fx.cavClip ? `clip-path:${h.fx.cavClip}` : '';
  // insideSvg：裡面直接畫一張圖（例如衣櫃裡的衣服）
  const cav = h.fx.insideSvg ? `<div class="cav" style="overflow:hidden">${h.fx.insideSvg()}</div>`
    : inside === 'same' ? `<div class="cav" style="${crop(r)};filter:brightness(.7)"></div>` : `<div class="cav ${inside}" style="${cavClip}"></div>`;
  // 透視距離跟門的寬度成比例，門轉開時才有立體感
  const persp = (t === 'doors' ? r[2] / 2 : r[2]) * 2.4 / W * 100;
  // 蓋子通常在最前面（例如禮盒放在櫃子前），所以疊在比較上層
  return `<div class="fx ${closedNow ? '' : 'open'}" data-fx="${h.id}" style="${box(...r)};perspective:${persp}cqw;${t === 'lid' ? 'z-index:7' : ''}">${cav}${leaves.map((lf) =>
    `<div class="leaf" data-open="${lf.open}" ${lf.fade ? 'data-fade="1"' : ''} style="${lf.css};transform-origin:${lf.origin};${crop(lf.r, h.fx.src)};${closedNow ? '' : `transform:${lf.open};${lf.fade ? 'opacity:0' : ''}`}"></div>`).join('')}</div>${front}`;
}

function render() {
  const st = LS(L.id), f = flags();
  const selType = sel ? (ITEMS[sel].type || sel) : null;
  const exitOpen = keyCount(L.id) >= UNLOCK_AT;
  const visible = L.hotspots.filter((h) => !h.show || h.show(f));
  // 大的區域先畫，小的蓋在上面，這樣小東西才點得到
  visible.sort((a, b) => b.r[2] * b.r[3] - a.r[2] * a.r[3]);

  let html = `<img class="bg" src="${L.image}" alt="" draggable="false">`;
  // 打開的門／抽屜（再點一次會關上，關上的就不畫；正在關的先畫成打開，再播關上的動畫）
  const shut = st.shut || {};
  html += L.hotspots.filter((h) => h.fx && STAYS_OPEN.includes(h.fx.t) && st.done[h.id] && (!shut[h.id] || closing === h.id))
    .map((h) => fxHtml(h, opened === h.id)).join('');
  html += L.overlays.map((o, i) => o.when(f) ? `<div class="ov ${o.cls || ''}" data-ov="${i}" style="${box(...o.r)}">${o.html(f)}</div>` : '').join('');
  html += visible.map((h) => {
    const target = h.needs && selType === h.needs && !st.done[h.id];
    const cls = ['hs', h.switch ? 'switch' : '', target ? 'target' : '', h.exit && exitOpen && !h.arrow ? 'exitOpen' : ''].join(' ');
    const sign = h.arrow ? `<div class="sign ${exitOpen ? 'open' : ''}">${exitOpen ? '' : '🔒 '}${h.arrow}</div>` : '';
    return `<div class="${cls}" data-kind="hs" data-id="${h.id}" style="${box(...h.r)}">${sign}</div>`;
  }).join('');
  html += L.pickups.filter((p) => !st.picked[p.item] && (!p.when || p.when(f)))
    .map((p) => `<div class="spr item" data-kind="pickup" data-id="${p.item}" style="${boxAt(p.at, p.size)}">${icon(ITEMS[p.item].icon)}</div>`).join('');
  html += L.hidden.map((pos, i) => ['h' + (i + 1), pos]).filter(([k]) => !st.keys[k])
    .map(([k, pos], i) => `<div class="spr hkey" data-kind="key" data-id="${k}" style="${boxAt(pos, 30)};transform:rotate(${(i * 67) % 360}deg)">
      <svg viewBox="0 0 100 100">${ICON.key('gBrass')}</svg></div>`).join('');
  html += Object.entries(L.keys).filter(([k]) => st.revealed[k] && !st.keys[k])
    .map(([k, pos]) => `<div class="spr pkey" data-kind="key" data-id="${k}" style="${boxAt(pos, 44)}">${icon('key')}</div>`).join('');
  if (L.dark) html += '<div id="dark"></div>' + L.dark.glows.map(([x, y, t]) =>
    `<div class="glow" style="left:${x / W * 100}%;top:${y / H * 100}%">${t}</div>`).join('');

  const scene = $('#scene');
  scene.innerHTML = `<div id="stage" style="transform:${zoomCss()}">${html}</div>`;
  scene.classList.toggle('dark', dark);
  scene.classList.toggle('edit', EDIT);

  $('#inv').innerHTML = st.inv.length
    ? st.inv.map((id) => `<div class="item ${sel === id ? 'sel' : ''}" data-item="${id}">${icon(ITEMS[id].icon)}<small>${ITEMS[id].name}</small></div>`).join('')
    : '<span class="empty">還沒有任何東西</span>';
  $('#lvKeys').textContent = `🔑 ${keyCount(L.id)} / ${KEYS_PER_LEVEL}`;

  runAnimations();
}

// 畫面更新後播放動畫
function runAnimations() {
  const scene = $('#scene');
  // 門、抽屜、蓋子打開
  if (opened) {
    // 用剪刀剪開的東西，等剪刀剪完再打開
    const delay = L.hotspots.find((h) => h.id === opened)?.cut && !reopened ? 700 : 0;
    scene.querySelectorAll(`.fx[data-fx="${opened}"] .leaf`).forEach((lf) => {
      const end = lf.dataset.fade ? { transform: lf.dataset.open, opacity: 0 } : { transform: lf.dataset.open };
      lf.animate([{ transform: 'none', opacity: 1 }, ...(lf.dataset.fade ? [{ transform: 'translateY(-90%) rotate(-6deg)', opacity: 1, offset: 0.6 }] : []), end],
        { duration: lf.dataset.fade ? 1000 : 850, delay, easing: 'cubic-bezier(.3,.8,.3,1)', fill: 'both' });
    });
    scene.querySelector(`.fx[data-fx="${opened}"]`)?.classList.add('open');
  }
  // 門／抽屜關上
  if (closing) {
    const fx = scene.querySelector(`.fx[data-fx="${closing}"]`);
    fx?.classList.remove('open');
    fx?.querySelectorAll('.leaf').forEach((lf) => {
      lf.animate([{ transform: lf.dataset.open, opacity: lf.dataset.fade ? 0 : 1 }, { transform: 'none', opacity: 1 }], { duration: 600, easing: 'ease-in', fill: 'forwards' });
    });
    if (fx) setTimeout(() => fx.remove(), 620);
  }
  // 疊加圖層的動畫（春聯展開、福字翻轉、動物登場…）
  L.overlays.forEach((o, i) => {
    const el = scene.querySelector(`[data-ov="${i}"]`);
    if (!el || !o.anim) return;
    [].concat(o.anim).filter((a) => a.on === acted).forEach((a) => animateOverlay(el, a));
  });
  // 剛出現的鑰匙彈出來
  freshKeys.forEach((k) => {
    const el = scene.querySelector(`.spr[data-id="${k}"]`);
    // fill: 'backwards' 讓鑰匙在等待的 0.25 秒內先保持隱藏，不會先閃一下
    el?.animate([{ transform: 'scale(0) rotate(-200deg)', opacity: 0 }, { transform: 'scale(1.5)', opacity: 1, offset: 0.6 }, { transform: 'scale(1)', opacity: 1 }],
      { duration: 800, easing: 'ease-out', delay: 250, fill: 'backwards' });
  });
  if (freshKeys.length) setTimeout(() => Music.sfx('reveal'), 250);
  post.forEach((fn) => fn());
  acted = null; opened = null; closing = null; reopened = false; freshKeys = []; post = [];
}

function animateOverlay(el, a) {
  const kf = {
    unrollY: [{ transform: 'scaleY(0)', transformOrigin: 'top' }, { transform: 'scaleY(1)', transformOrigin: 'top' }],
    unrollX: [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
    fade: [{ opacity: 0 }, { opacity: 1 }],
    pop: [{ transform: 'scale(0)' }, { transform: 'scale(1.2)', offset: 0.7 }, { transform: 'scale(1)' }],
    flip: [{ transform: 'rotate(-180deg) scale(1.2)' }, { transform: 'rotate(0) scale(1)' }],
    bump: [{ transform: 'scale(1.15)' }, { transform: 'scale(1)' }],
  }[a.t];
  if (kf) return el.animate(kf, { duration: a.t === 'fade' ? 1200 : 650, delay: a.delay || 0, easing: 'ease-out', fill: 'backwards' });
  // 月曆：剛撕下的那一頁往下飄走
  if (a.t === 'tear') {
    el.querySelector('.tearing')?.animate([
      { transform: 'none', opacity: 1, transformOrigin: 'top left' },
      { transform: 'translate(8%, 6%) rotate(8deg)', opacity: 1, offset: 0.25, transformOrigin: 'top left' },
      { transform: 'translate(45%, 80%) rotate(40deg)', opacity: 0, transformOrigin: 'top left' },
    ], { duration: 900, easing: 'ease-in', fill: 'forwards' });
    Music.sfx('rip');
    return;
  }
  // 板凳：從上面放下來，碰到地板彈一下
  if (a.t === 'drop') {
    return el.animate([{ transform: 'translateY(-40%)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1, offset: 0.6 }, { transform: 'translateY(-4%)' }, { transform: 'translateY(0)' }],
      { duration: 700, easing: 'ease-in', fill: 'backwards' });
  }
  // 音樂盒：轉發條；打開時蓋子掀起來
  if (a.t === 'crank') {
    el.querySelector('.crank')?.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(720deg)' }], { duration: 700, easing: 'ease-in-out' });
    el.querySelector('.mbLid')?.animate([{ transform: 'scaleY(0.15)' }, { transform: 'scaleY(1.1)', offset: 0.7 }, { transform: 'scaleY(1)' }],
      { duration: 600, delay: 600, easing: 'ease-out', fill: 'backwards' });
    return;
  }
  // 動物從畫面外移動進來
  const r = stageRect(), s = r.width / W;
  const [dx, dy] = a.from;
  el.classList.add(a.t === 'flyIn' ? 'flying' : 'walking');
  if (a.t === 'flyIn') Music.sfx('flap');
  el.animate([
    { transform: `translate(${dx * s}px, ${dy * s}px)` },
    { transform: `translate(${dx * s * 0.25}px, ${dy * s * 0.15 - 30 * s}px)`, offset: 0.7 },
    { transform: 'translate(0, 0)' },
  ], { duration: a.dur, easing: 'ease-out' });
  setTimeout(() => el.classList.remove('flying', 'walking'), a.dur);
}

// 動一下就恢復的動畫：把那一塊圖切出來晃一晃，底下墊一張模糊的同一塊圖
function playFx(h) {
  const r = h.fx.r || h.r, t = h.fx.t, delay = h.fx.delay || 0;
  // 倒水：一條往下流的水柱
  if (t === 'pour') {
    // tool：倒水用的東西（熱水瓶、澆水壺）先出現、傾斜，倒完再放回去
    const tool = h.fx.tool;
    const wait = tool ? 450 : delay;
    if (tool) {
      const im = document.createElement('img');
      im.src = tool.src; im.alt = '';
      im.setAttribute('style', `position:absolute;${box(...tool.r)};z-index:9;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))`);
      stage().appendChild(im);
      im.animate([
        { opacity: 0, transform: 'translateY(-20%) rotate(0deg)' },
        { opacity: 1, transform: `rotate(${tool.rot}deg)`, offset: 0.22 },
        { opacity: 1, transform: `rotate(${tool.rot}deg)`, offset: 0.8 },
        { opacity: 0, transform: 'translateY(-20%) rotate(0deg)' },
      ], { duration: 2100, easing: 'ease-in-out', fill: 'forwards' });
      setTimeout(() => im.remove(), 2150);
    }
    const w = document.createElement('div');
    w.className = 'pour';
    w.setAttribute('style', box(...r));
    stage().appendChild(w);
    w.animate([{ transform: 'scaleY(0)', opacity: 0 }, { transform: 'scaleY(1)', opacity: 1, offset: 0.15 }, { transform: 'scaleY(1)', opacity: 1, offset: 0.8 }, { opacity: 0 }],
      { duration: 1400, delay: wait, easing: 'linear', fill: 'both' });
    setTimeout(() => Music.sfx('water'), wait);
    setTimeout(() => w.remove(), 1450 + wait);
    return;
  }
  // 轉盤：圖上的橢圓其實是平放的圓，先拉成圓形、轉一圈、再壓回橢圓
  if (t === 'turntable') {
    const k = r[3] / r[2];
    const c = document.createElement('div');
    c.className = 'fx';
    c.setAttribute('style', `${box(...r)};border-radius:50%;overflow:hidden`);
    c.innerHTML = `<div class="leaf" style="left:0;width:100%;${crop(r)}"></div>`;
    stage().appendChild(c);
    // 中間轉得快的時候加一點模糊，看起來比較像真的在轉
    c.querySelector('.leaf').animate([
      { transform: `scaleY(${k}) rotate(0deg) scaleY(${1 / k})`, filter: 'blur(0)' },
      { transform: `scaleY(${k}) rotate(120deg) scaleY(${1 / k})`, filter: 'blur(1.5px)', offset: 0.3 },
      { transform: `scaleY(${k}) rotate(270deg) scaleY(${1 / k})`, filter: 'blur(1.5px)', offset: 0.7 },
      { transform: `scaleY(${k}) rotate(360deg) scaleY(${1 / k})`, filter: 'blur(0)' },
    ], { duration: 900, easing: 'ease-in-out' });
    setTimeout(() => c.remove(), 950);
    return;
  }
  const KF = {
    wiggle: [[0, 0], [-9, 0], [8, 0], [-5, 0], [3, 0], [0, 0]].map(([d]) => ({ transform: `rotate(${d}deg)` })),
    shake: [0, -5, 5, -4, 4, -2, 0].map((x) => ({ transform: `translateX(${x}px)` })),
    lift: [{ transform: 'none' }, { transform: 'translateY(-22%) rotate(-5deg)', offset: 0.4 }, { transform: 'translateY(-22%) rotate(-5deg)', offset: 0.6 }, { transform: 'none' }],
    sway: [0, 5, -4, 3, -2, 0].map((d) => ({ transform: `rotate(${d}deg)` })),
    spin: [{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }],
    spinY: [{ transform: 'rotateY(0)' }, { transform: 'rotateY(360deg)' }],
    tear: [{ transform: 'none', opacity: 1 }, { transform: 'translate(40%, 70%) rotate(35deg)', opacity: 0 }],
    // 拿走：往上拿起來，然後縮小消失（底下已經換成沒有這個東西的圖）
    take: [{ transform: 'none', opacity: 1 }, { transform: 'translateY(-25%) scale(1.05)', opacity: 1, offset: 0.4 }, { transform: 'translateY(-55%) scale(.5)', opacity: 0 }],
  }[t];
  if (!KF) return;
  const origin = { wiggle: 'center bottom', sway: 'center top', lift: 'center bottom', tear: 'left top' }[t] || 'center';
  const c = document.createElement('div');
  c.className = 'fx';
  c.setAttribute('style', box(...r));
  c.innerHTML = (t === 'tear' || t === 'take' ? '' : `<div class="under" style="${crop(r)}"></div>`) +
    `<div class="leaf" style="left:0;width:100%;transform-origin:${origin};${crop(r)}"></div>`;
  stage().appendChild(c);
  const dur = { spin: 700, spinY: 900, lift: 900, sway: 900, tear: 750 }[t] || 500;
  c.querySelector('.leaf').animate(KF, { duration: dur, delay, easing: 'ease-in-out', fill: 'forwards' });
  setTimeout(() => c.remove(), dur + delay + 50);
}

// 剪刀沿著一條線剪過去
function playCut([x1, y1, x2, y2]) {
  const s = document.createElement('div');
  s.className = 'scissor';
  s.innerHTML = icon('scissors');
  const size = 46;
  s.setAttribute('style', boxAt([x1, y1], size));
  stage().appendChild(s);
  const sc = stageRect().width / W;
  const dx = (x2 - x1) * sc, dy = (y2 - y1) * sc;
  // 剪刀橫著拿，一邊前進一邊開合
  s.animate(Array.from({ length: 7 }, (_, i) => ({
    transform: `translate(${dx * i / 6}px, ${dy * i / 6}px) rotate(90deg) scaleX(${i % 2 ? 0.7 : 1})`,
  })), { duration: 650, easing: 'linear', fill: 'forwards' });
  Music.sfx('snip');
  setTimeout(() => s.remove(), 700);
}

// ============================================================
//  互動
// ============================================================
// ============================================================
//  放大縮小：兩指縮放、放大後單指（或滑鼠）拖曳移動
// ============================================================
const Z = { s: 1, x: 0, y: 0 };
const zoomCss = () => `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`;
function clampZoom() {
  const r = $('#scene').getBoundingClientRect();
  Z.s = Math.min(3.5, Math.max(1, Z.s));
  Z.x = Math.min(0, Math.max(r.width * (1 - Z.s), Z.x));
  Z.y = Math.min(0, Math.max(r.height * (1 - Z.s), Z.y));
}
function applyZoom(smooth) {
  clampZoom();
  const st = $('#stage');
  if (!st) return;
  st.classList.toggle('smooth', !!smooth);
  st.style.transform = zoomCss();
}
// 以場景上的 (px, py) 為中心縮放（沒給就用畫面中央）
function zoomBy(f, px, py) {
  const r = $('#scene').getBoundingClientRect();
  if (px === undefined) { px = r.width / 2; py = r.height / 2; }
  const sx = (px - Z.x) / Z.s, sy = (py - Z.y) / Z.s;
  Z.s = Math.min(3.5, Math.max(1, Z.s * f));
  Z.x = px - sx * Z.s; Z.y = py - sy * Z.s;
  applyZoom(true);
}
function zoomReset() { Z.s = 1; Z.x = 0; Z.y = 0; applyZoom(true); }

const pointers = new Map();
let gesture = null, suppressClick = false;
$('#scene').addEventListener('pointerdown', (e) => {
  if (EDIT) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = $('#scene').getBoundingClientRect();
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    gesture = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), s0: Z.s, sx: (mx - Z.x) / Z.s, sy: (my - Z.y) / Z.s };
    suppressClick = true;
  } else if (pointers.size === 1) {
    gesture = { type: 'pan', x0: e.clientX, y0: e.clientY, zx: Z.x, zy: Z.y, moved: false };
  }
});
$('#scene').addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId) || !gesture) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = $('#scene').getBoundingClientRect();
  if (gesture.type === 'pinch' && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    Z.s = Math.min(3.5, Math.max(1, gesture.s0 * Math.hypot(a.x - b.x, a.y - b.y) / gesture.d0));
    Z.x = mx - gesture.sx * Z.s; Z.y = my - gesture.sy * Z.s;
    applyZoom(false);
  } else if (gesture.type === 'pan' && Z.s > 1) {
    const dx = e.clientX - gesture.x0, dy = e.clientY - gesture.y0;
    // 移動超過 8 像素才算拖曳，不然當成點擊
    if (!gesture.moved && Math.hypot(dx, dy) < 8) return;
    gesture.moved = true; suppressClick = true;
    Z.x = gesture.zx + dx; Z.y = gesture.zy + dy;
    applyZoom(false);
  }
});
const endPointer = (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) gesture = null;
  else if (gesture && gesture.type === 'pinch' && pointers.size === 1) {
    // 兩指放開一指，剩下那指接著拖曳
    const [p] = [...pointers.values()];
    gesture = { type: 'pan', x0: p.x, y0: p.y, zx: Z.x, zy: Z.y, moved: true };
  }
};
['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => $('#scene').addEventListener(t, endPointer));

// 全螢幕（Android 的瀏覽器可以；iPhone 的 Safari 不支援，改成提示「加入主畫面」）
function toggleFullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement) return document.exitFullscreen();
  if (!el.requestFullscreen) return say('這個瀏覽器不支援全螢幕。iPhone 可以按分享 →「加入主畫面」，從主畫面打開就是全螢幕。');
  el.requestFullscreen().then(() => screen.orientation?.lock?.('landscape').catch(() => {})).catch(() => {});
}

// 依照螢幕形狀切換版面：手機橫放用手機版、手機直拿提示轉橫
function updateLayout() {
  const w = innerWidth, h = innerHeight;
  document.body.classList.toggle('mobile', w > h && h <= 540);
  document.body.classList.toggle('portraitPhone', h > w && w <= 540);
  if (L) applyZoom(false);
}
addEventListener('resize', updateLayout);
addEventListener('orientationchange', () => setTimeout(updateLayout, 200));

$('#scene').addEventListener('click', (e) => {
  if (EDIT && editDragged) return;
  // 剛剛是在拖曳或兩指縮放，不算點擊
  if (suppressClick) { suppressClick = false; return; }
  const el = e.target.closest('[data-kind]');
  if (!el || !L) return;
  lastPt = [e.clientX, e.clientY];
  const { kind, id } = el.dataset;
  if (kind === 'key') collectKey(id, el);
  else if (kind === 'pickup') pickUp(id);
  else if (kind === 'hs') clickHotspot(L.hotspots.find((h) => h.id === id));
  persist();
  if (L) render();
});

$('#inv').addEventListener('click', (e) => {
  const el = e.target.closest('.item');
  if (!el) return;
  sel = sel === el.dataset.item ? null : el.dataset.item;
  if (sel) { say(`選取了<b>${ITEMS[sel].name}</b>，點房間裡想用它的地方（會發光的地方就是可以用的）。`); Music.sfx('tap'); }
  render();
});

function give(items) {
  const st = LS(L.id), from = lastPt;
  items.filter((id) => !st.picked[id]).forEach((id, i) => {
    st.picked[id] = true; st.inv.push(id);
    if (from) post.push(() => setTimeout(() => fly(icon(ITEMS[id].icon), from, rectCenter($('#inv'))), i * 120));
  });
  Music.sfx('pick');
}
function useUp(id) {
  const st = LS(L.id);
  st.inv = st.inv.filter((x) => x !== id);
  if (sel === id) sel = null;
}

function pickUp(item) {
  const p = L.pickups.find((x) => x.item === item);
  give([item]);
  say(p.text);
}

function collectKey(k, el) {
  const st = LS(L.id);
  if (st.keys[k]) return;
  st.keys[k] = true;
  const from = rectCenter(el);
  post.push(() => fly(icon('key'), from, rectCenter($('#lvKeys'))));
  Music.sfx('key');
  const n = keyCount(L.id);
  post.push(() => toast(`🔑 ${n} / ${KEYS_PER_LEVEL}`));
  say(k.startsWith('h') ? `找到一把藏起來的<b>鑰匙</b>！（${n}/${KEYS_PER_LEVEL}）` : `撿到<b>鑰匙</b>！（${n}/${KEYS_PER_LEVEL}）`);
  if (grandTotal() === 100) return setTimeout(showEnding, 900);
  if (n === UNLOCK_AT) setTimeout(() => popup('可以往前走了！',
    `在「${L.name}」找到 ${UNLOCK_AT} 把鑰匙了！<br>${L.exitHint}。<br>也可以繼續把這裡的鑰匙找齊。`), 600);
  if (n === KEYS_PER_LEVEL) setTimeout(levelClear, 600);
}

// 只有真的有反應的時候才播動一下的動畫（純看看的東西不動）
const wiggleIt = (h) => { if (h.fx && !STAYS_OPEN.includes(h.fx.t)) post.push(() => playFx(h)); };

function clickHotspot(h) {
  const st = LS(L.id);
  if (h.switch) { dark = !dark; Music.sfx('tap'); return say(dark ? L.dark.on : L.dark.off); }
  if (h.modal) return showClue(h.modal, h.text);
  if (h.exit) return tryExit(h);
  if (st.done[h.id]) {
    // 打開過的門／抽屜：再點一下關上，再點又打開
    if (h.fx && STAYS_OPEN.includes(h.fx.t)) return toggleShut(h);
    return say(h.doneText || h.text);
  }

  const selType = sel ? (ITEMS[sel].type || sel) : null;
  if (h.needs) {
    if (selType !== h.needs) {
      if (sel) Music.sfx('wrong');
      if (sel && h.wrong && h.wrong[sel]) return say(h.wrong[sel]);
      return say(h.text + (sel ? `（${ITEMS[sel].name}好像用不上。）` : ''));
    }
    // 道具從物品欄飛過去
    const invEl = document.querySelector(`.item[data-item="${sel}"]`);
    if (invEl) { const from = rectCenter(invEl), to = toScreen(centerOf(h.r)), svg = icon(ITEMS[sel].icon); post.push(() => fly(svg, from, to)); }
    useUp(sel);
    acted = h.id;
    if (h.count) {
      st.counts[h.id] = (st.counts[h.id] || 0) + 1;
      if (st.counts[h.id] < h.count) { Music.sfx('tap'); return say(h.countText(st.counts[h.id])); }
    }
    return complete(h);
  }
  if (h.taps) {
    st.taps[h.id] = (st.taps[h.id] || 0) + 1;
    acted = h.id;
    Music.sfx(h.tapSfx || 'tap');
    if (st.taps[h.id] < h.taps) { wiggleIt(h); return say(h.tapTexts[st.taps[h.id] - 1] || h.text); }
    return complete(h);
  }
  if (h.code) return openCode(h);
  if (h.reward) return complete(h);
  say(h.text);
}

function complete(h) {
  LS(L.id).done[h.id] = true;
  acted = h.id;
  if (h.cut) post.push(() => playCut(h.cut));
  if (h.fx && STAYS_OPEN.includes(h.fx.t)) { opened = h.id; Music.sfx('open'); }
  wiggleIt(h);
  if (h.doneSfx) Music.sfx(h.doneSfx);
  applyReward(h.reward);
}

function toggleShut(h) {
  const st = LS(L.id);
  st.shut = st.shut || {};
  if (st.shut[h.id]) {
    delete st.shut[h.id];
    opened = h.id; reopened = true;
    Music.sfx('open');
    say(h.doneText || h.text);
  } else {
    st.shut[h.id] = true;
    closing = h.id;
    Music.sfx('tap');
    say('關上了。');
  }
}
function applyReward(r) {
  const st = LS(L.id);
  if (!r) return;
  (r.keys || []).forEach((k) => { if (!st.revealed[k]) { st.revealed[k] = true; freshKeys.push(k); } });
  if (r.items) give(r.items);
  if (r.text) say(r.text);
  // 檢查有沒有條件達成的規則（例如春聯三張都貼好）
  const f = flags();
  for (const rule of L.rules) {
    if (!st.done[rule.id] && rule.when(f)) { st.done[rule.id] = true; applyReward(rule.reward); }
  }
}

// 出口：找到 15 把就能去下一關
function tryExit(h) {
  const n = keyCount(L.id);
  if (n < UNLOCK_AT) return say(`${h.text}<br>（在這裡找到 ${UNLOCK_AT} 把鑰匙才能過去，目前 ${n} 把。）`);
  if (L.next === 'end') {
    if (grandTotal() === 100) return transition(showEnding);
    const left = 100 - grandTotal();
    return say(`阿嬤說：「還有 <b>${left}</b> 把鑰匙沒找到喔，找齊了才開飯！」可以按「選關」回去其他地方找。`);
  }
  Music.sfx('open');
  const idx = LEVELS.findIndex((x) => x.id === L.next);
  transition(() => enter(idx));
}

// ============================================================
//  密碼鎖、線索、照片
// ============================================================
let codeH, dials;
function openCode(h) {
  codeH = h; dials = Array(h.code.length).fill(0);
  drawCode();
  showModal();
}
function drawCode(msg = '') {
  $('#modalBox').innerHTML = `<h2>${codeH.codeTitle}</h2><div>${codeH.code.length} 位數密碼</div>
    <div class="dials">${dials.map((v, i) => `<div class="dial"><button onclick="turn(${i},1)">▲</button><span>${v}</span><button onclick="turn(${i},-1)">▼</button></div>`).join('')}</div>
    <div style="min-height:22px;color:var(--red)">${msg}</div>
    <button onclick="tryCode()">開鎖</button><button class="ghost" onclick="closeModal()">先不要</button>`;
}
function turn(i, d) { dials[i] = (dials[i] + d + 10) % 10; Music.sfx('tap'); drawCode(); }
function tryCode() {
  if (dials.join('') !== codeH.code) { Music.sfx('wrong'); return drawCode('喀喀…打不開。'); }
  closeModal();
  lastPt = toScreen(centerOf(codeH.r));
  complete(codeH);
  persist(); render();
}
// 製作說明：素材來源
function showCredits() {
  $('#modalBox').innerHTML = `<h2>製作說明</h2>
    <div style="text-align:left;line-height:1.8;font-size:15px">
      <b>遊戲設計與程式</b>：原創，純 HTML／CSS／JavaScript，沒有使用外部函式庫。<br>
      <b>場景圖與照片</b>：使用 AI 圖片生成工具產生；拿起東西時的補圖與去背由程式處理。<br>
      <b>道具、動物等小插圖</b>：用 SVG 程式繪製。<br>
      <b>背景音樂與音效</b>：原創旋律，用瀏覽器的 Web Audio 即時合成，沒有使用現成歌曲或錄音。<br>
      <b>字型</b>：使用裝置內建字型（標楷體等）。<br>
      <span style="color:#8b6a55">本作品為非營利的個人練習作品，圖中人物皆為 AI 生成，不代表真實人物。</span>
    </div>
    <button onclick="closeModal()">好</button>`;
  showModal();
}

const picture = (src, cls, missing) =>
  `<img class="pic ${cls}" src="${src}" alt="" onerror="this.outerHTML='<div class=ph>${missing}</div>'">`;
const CLUES = {
  calendar: () => {
    const circled = { 8: '①', 2: '②', 5: '③' };
    return `<h2>阿嬤的月曆</h2><div>阿嬤在三個日子畫了紅圈，旁邊寫著「<b>碗櫥</b>」。</div>
      <div class="cal">${['日', '一', '二', '三', '四', '五', '六'].map((d) => `<div style="background:none">${d}</div>`).join('')}
      ${Array.from({ length: 28 }, (_, i) => i + 1).map((d) => `<div class="${circled[d] ? 'c' : ''}">${d}${circled[d] ? `<sup>${circled[d]}</sup>` : ''}</div>`).join('')}</div>
      <button onclick="closeModal()">記住了</button>`;
  },
  photoOld: () => `<h2>老照片</h2>${picture('images/family-old.jpg', 'old', '（老照片還沒放進來：images/family-old.jpg）')}
    <p>民國五十四年拍的全家福，一家六口：<br>阿公、阿嬤，還有大兒子、二兒子、三女兒和小兒子。</p>
    <button onclick="closeModal()">好懷念</button>`,
  photoNew: () => `<h2>全家福</h2>${picture('images/family-new.jpg', '', '（全家福還沒放進來：images/family-new.jpg）')}
    <p>去年過年拍的全家福。四個孩子都成家了，還多了好多孫子孫女，阿公阿嬤笑得好開心。</p>
    <button onclick="closeModal()">好溫馨</button>`,
};
function showClue(name, text) {
  say(text);
  Music.sfx('tap');
  $('#modalBox').innerHTML = CLUES[name]();
  showModal();
}
function popup(title, body) {
  $('#modalBox').innerHTML = `<h2>${title}</h2><p>${body}</p><button onclick="closeModal()">好</button>`;
  showModal();
}
function showModal(wide = false) {
  $('#modalBox').classList.toggle('wide', wide || !!$('#modalBox .pic'));
  $('#modal').classList.add('show');
}
function closeModal() {
  $('#modal').classList.remove('show');
  if (Music.want === 'ending') Music.scene(L ? L.music : 'home');
}

// ============================================================
//  提示、放大鏡
// ============================================================
function showHint() {
  if (dark) { dark = false; render(); }
  const f = flags();
  const h = L.hints.find(([cond]) => cond(f));
  SAVE.hints++; persist();
  if (h) return say('👵 阿嬤：' + h[1]);
  const st = LS(L.id);
  const left = L.hidden.filter((_, i) => !st.keys['h' + (i + 1)]).length;
  const waiting = Object.keys(L.keys).filter((k) => st.revealed[k] && !st.keys[k]).length;
  if (waiting) return say('👵 阿嬤：房間裡還有發亮的鑰匙沒撿起來喔。');
  say(left ? `👵 阿嬤：機關都解開了！還有 <b>${left}</b> 把鑰匙藏在角落，用<b>放大鏡</b>找找看。` : '👵 阿嬤：這裡的鑰匙都找齊了！');
}
function useLens() {
  if (dark) { dark = false; render(); }
  const st = LS(L.id);
  const left = L.hidden.map((_, i) => 'h' + (i + 1)).filter((k) => !st.keys[k]);
  if (!left.length) return say('🔍 這裡藏起來的鑰匙都找到了。');
  const k = left[st.lensIdx++ % left.length];
  SAVE.lens++; persist();
  const el = document.querySelector(`.spr[data-id="${k}"]`);
  el.classList.add('flash');
  setTimeout(() => el && el.classList.remove('flash'), 3000);
  Music.sfx('reveal');
  say(`🔍 放大鏡照到了一個地方…（還有 ${left.length} 把藏起來的鑰匙）`);
}

// ============================================================
//  過關、結局
// ============================================================
function levelClear() {
  confetti();
  popup(`${L.name}完成！`, `「${L.name}」的 20 把鑰匙全部找到了！<br>目前總共 <b>${grandTotal()}</b> / 100 把。`);
}
function showEnding() {
  Music.sfx('firecracker');
  Music.scene('ending');
  confetti();
  $('#modalBox').innerHTML = `<h2>新年快樂！</h2>
    ${picture('images/ending.jpg', '', '（結局圖還沒放進來：images/ending.jpg）')}
    <div class="speech">阿公阿嬤：「來喔～大家緊來呷飯！」</div>
    <p>100 把鑰匙全部找齊了！一家人圍著滿桌的年菜，熱熱鬧鬧地吃年夜飯。<br>阿嬤笑著塞給你一個大紅包：「平平安安、萬事如意！」🧧</p>
    <button onclick="closeModal();goHome()">新年快樂！</button>`;
  showModal(true);
}
function confetti() {
  const pieces = ['key', 'orange', 'fu', 'coin'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.innerHTML = icon(pieces[i % pieces.length]);
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDuration = 2 + Math.random() * 2 + 's';
    c.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}
function confirmWipe() {
  $('#modalBox').innerHTML = `<h2>清除進度？</h2><p>所有關卡找到的鑰匙都會消失，沒辦法復原。</p>
    <button onclick="wipe()">清除</button><button class="ghost" onclick="closeModal()">取消</button>`;
  showModal();
}
function wipe() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 沒關係 */ }
  loadSave(); closeModal(); goHome();
}

// ============================================================
//  標記模式（網址後面加 ?edit）：在圖上拖曳，就會顯示原圖座標
// ============================================================
let editStart = null, editDragged = false;
function toImg(e) {
  const r = stageRect();
  return [Math.round((e.clientX - r.left) / r.width * W), Math.round((e.clientY - r.top) / r.height * H)];
}
if (EDIT) {
  $('#scene').addEventListener('mousedown', (e) => { editStart = toImg(e); editDragged = false; });
  $('#scene').addEventListener('mousemove', (e) => {
    if (!editStart) return;
    const [x, y] = toImg(e);
    if (Math.abs(x - editStart[0]) + Math.abs(y - editStart[1]) < 6) return;
    editDragged = true;
    let b = $('#editBox');
    if (!b) { b = document.createElement('div'); b.id = 'editBox'; stage().appendChild(b); }
    b.setAttribute('style', box(Math.min(x, editStart[0]), Math.min(y, editStart[1]), Math.abs(x - editStart[0]), Math.abs(y - editStart[1])));
  });
  window.addEventListener('mouseup', (e) => {
    if (!editStart) return;
    const [x, y] = toImg(e);
    $('#editOut').textContent = editDragged
      ? `區域 r: [${Math.min(x, editStart[0])}, ${Math.min(y, editStart[1])}, ${Math.abs(x - editStart[0])}, ${Math.abs(y - editStart[1])}]`
      : `位置 [${x}, ${y}]`;
    editStart = null;
    setTimeout(() => { editDragged = false; }, 0);
  });
}

Music.init();
loadSave();
updateLayout();
goHome();
</script>
