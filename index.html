<title>阿嬤家找鑰匙</title>
<style>
  :root {
    --bg: #1d130d; --panel: #2a1c13; --ink: #f6e7d2; --muted: #c2a688; --gold: #f2b632; --line: #5a3d27;

  }
  * { box-sizing: border-box; }

    margin: 0; color: var(--ink); min-height: 100vh;

  .main {
    display: block; border-radius: 18px; overflow: hidden; border: 2px solid var(--line); background: var(--panel);
    text-decoration: none; color: inherit; transition: transform .15s, border-color .15s;
  }
  .main:hover { transform: translateY(-3px); border-color: var(--gold); }
  .main img { width: 100%; display: block; }
  .main div { padding: 14px 18px; font-size: 20px; font-weight: 700; color: #ffd98a; }
